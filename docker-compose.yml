services:
  frontend:
    build:
      context: ./weather_app_frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./weather_app_frontend/src:/app/src
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    command: ["npm", "run", "dev", "--", "--host"]